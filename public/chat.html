<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-Ondzet · Discussion</title>
<style>
:root{--bg:#0b0f08;--row:#151c10;--acc:#76b900;--txt:#fff;--sub:#9aa394;--err:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f0;--row:#fff;--txt:#10150c;--sub:#5d6656}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #76b90044}
header h1{font-size:17px;margin:0;flex:1}header h1 span{color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:20px;padding:9px 16px;font-weight:700;background:var(--acc);color:#000}
button.ghost{background:transparent;color:var(--txt);border:1px solid #76b90088}
input,select{font:inherit;width:100%;padding:11px 14px;margin:5px 0;border-radius:12px;border:1px solid #76b90055;background:var(--row);color:var(--txt)}
.card{max-width:380px;margin:auto;padding:24px;width:100%}
.card h2{margin-top:0}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.err{color:var(--err);min-height:1.3em;font-weight:600}.link{color:var(--acc);cursor:pointer;background:none;border:0;padding:6px 0;font-weight:600}
#chat{flex:1;display:none;flex-direction:column;min-height:0}
#list{flex:1;overflow-y:auto;padding:14px 16px}
.msg{max-width:min(520px,88%);background:var(--row);border-radius:14px;padding:8px 12px;margin:0 0 10px}
.msg.me{margin-left:auto;background:#76b90030}
.msg b{font-size:13px;color:var(--acc)}.msg time{font-size:11px;color:var(--sub);margin-left:6px}
.msg p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.msg img{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-top:6px;cursor:zoom-in}
form#send{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #76b90044;align-items:center}
form#send input[type=text]{margin:0;flex:1}
#prev{display:none;padding:6px 16px;font-size:13px;color:var(--sub)}
#prev img{height:46px;border-radius:8px;vertical-align:middle;margin-right:8px}
</style></head><body>
<header><h1>G-Ondzet <span>· Discussion</span></h1><span id="who"></span><button class="ghost" id="out" style="display:none">Déconnexion</button></header>

<div id="auth" class="card">
  <div class="tabs"><button id="tLogin">Connexion</button><button class="ghost" id="tReg">Créer un compte</button></div>
  <div id="fLogin">
    <input id="lu" placeholder="Nom d'utilisateur" autocomplete="username">
    <input id="lp" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="bLogin" style="width:100%;margin-top:8px">Se connecter</button>
    <button class="link" id="forgot">Mot de passe oublié ?</button>
  </div>
  <div id="fReg" style="display:none">
    <input id="ru" placeholder="Nom d'utilisateur (3-20)" autocomplete="username">
    <input id="rp" type="password" placeholder="Crée un mot de passe (6 min.)" autocomplete="new-password">
    <select id="rq"></select>
    <input id="rqc" placeholder="Ta question personnelle" style="display:none">
    <input id="ra" placeholder="Réponse à la question">
    <button id="bReg" style="width:100%;margin-top:8px">Créer mon compte</button>
  </div>
  <div id="fRec" style="display:none">
    <input id="cu" placeholder="Nom d'utilisateur">
    <button id="bQ" style="width:100%;margin:6px 0">Afficher ma question</button>
    <div id="cq" style="font-weight:700;margin:6px 0"></div>
    <div id="cstep" style="display:none"><input id="ca" placeholder="Ta réponse"><input id="cn" type="password" placeholder="Nouveau mot de passe (6 min.)" autocomplete="new-password">
    <button id="bR" style="width:100%;margin-top:6px">Changer le mot de passe</button></div>
    <button class="link" id="back">← Retour</button>
  </div>
  <div class="err" id="err"></div>
</div>

<div id="chat">
  <div id="list"></div>
  <div id="prev"></div>
  <form id="send">
    <button type="button" class="ghost" id="pick" title="Envoyer une image">📷</button>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="text" id="txt" maxlength="1000" placeholder="Ton message…" autocomplete="off">
    <button>Envoyer</button>
  </form>
</div>

<script>
const $=id=>document.getElementById(id);
const QUESTIONS=['Quel est le nom de ton chat ou de ton chien ?','Quel est ton jeu préféré ?','Dans quelle ville es-tu né(e) ?','Quel est le prénom de ta mère ?','Quel était ton premier jeu vidéo ?','Autre question (je l\'écris moi-même)…'];
QUESTIONS.forEach((q,i)=>{const o=document.createElement('option');o.value=i;o.textContent=q;$('rq').appendChild(o)});
$('rq').onchange=()=>$('rqc').style.display=$('rq').value==QUESTIONS.length-1?'block':'none';
let token=localStorage.gtoken||'',me=localStorage.guser||'',last=0,poll=null,img=null;
const show=(a)=>{['fLogin','fReg','fRec'].forEach(x=>$(x).style.display=x===a?'block':'none');$('err').textContent='';
  $('tLogin').className=a==='fReg'?'ghost':'';$('tReg').className=a==='fReg'?'':'ghost'};
$('tLogin').onclick=()=>show('fLogin');$('tReg').onclick=()=>show('fReg');$('forgot').onclick=()=>show('fRec');$('back').onclick=()=>show('fLogin');
async function api(m,p,b){
  const r=await fetch(p,{method:m,headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&token&&p.startsWith('/v1/chat')){logout();throw new Error('Session expirée')}
  if(!r.ok)throw new Error(j.error||'Erreur');return j}
const fail=e=>$('err').textContent=e.message;
function enter(j){token=j.token;me=j.username;localStorage.gtoken=token;localStorage.guser=me;start()}
$('bLogin').onclick=()=>api('POST','/v1/login',{username:$('lu').value,password:$('lp').value}).then(enter).catch(fail);
$('bReg').onclick=()=>{const i=+$('rq').value,q=i===QUESTIONS.length-1?$('rqc').value:QUESTIONS[i];
  api('POST','/v1/register',{username:$('ru').value,password:$('rp').value,question:q,answer:$('ra').value}).then(enter).catch(fail)};
$('bQ').onclick=()=>api('POST','/v1/recover/question',{username:$('cu').value}).then(j=>{$('cq').textContent=j.question;$('cstep').style.display='block';$('err').textContent=''}).catch(fail);
$('bR').onclick=()=>api('POST','/v1/recover/reset',{username:$('cu').value,answer:$('ca').value,newPassword:$('cn').value}).then(enter).catch(fail);
function logout(){api('POST','/v1/logout').catch(()=>{});token='';me='';delete localStorage.gtoken;delete localStorage.guser;clearInterval(poll);last=0;$('list').textContent='';
  $('chat').style.display='none';$('auth').style.display='block';$('out').style.display='none';$('who').textContent=''}
$('out').onclick=logout;
function add(m){
  const d=document.createElement('div');d.className='msg'+(m.user===me?' me':'');
  const b=document.createElement('b');b.textContent=m.user;const t=document.createElement('time');
  t.textContent=new Date(m.ts).toLocaleString([], {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  d.append(b,t);
  if(m.text){const p=document.createElement('p');p.textContent=m.text;d.appendChild(p)}
  if(m.image){const i=document.createElement('img');i.src='/uploads/'+m.image;i.loading='lazy';i.alt='image';i.onclick=()=>window.open(i.src,'_blank','noopener');d.appendChild(i)}
  $('list').appendChild(d)}
async function refresh(){
  try{const j=await api('GET','/v1/chat?after='+last);
    if(j.messages.length){const bottom=$('list').scrollHeight-$('list').scrollTop-$('list').clientHeight<80;
      j.messages.forEach(m=>{add(m);last=Math.max(last,m.id)});if(bottom||last===j.messages[j.messages.length-1].id&&$('list').children.length===j.messages.length)$('list').scrollTop=1e9}
  }catch(e){}}
function start(){$('auth').style.display='none';$('chat').style.display='flex';$('out').style.display='';$('who').textContent=me;
  $('list').textContent='';last=0;refresh();clearInterval(poll);poll=setInterval(refresh,3000)}
$('pick').onclick=()=>$('file').click();
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;
  const im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    img=c.toDataURL('image/jpeg',.82);$('prev').style.display='block';$('prev').innerHTML='';
    const p=document.createElement('img');p.src=img;const x=document.createElement('a');x.href='#';x.textContent='Retirer';
    x.onclick=e=>{e.preventDefault();img=null;$('prev').style.display='none'};$('prev').append(p,x);URL.revokeObjectURL(im.src)};
  im.onerror=()=>alert('Image illisible');im.src=URL.createObjectURL(f);$('file').value=''};
$('send').onsubmit=async e=>{e.preventDefault();const text=$('txt').value.trim();if(!text&&!img)return;
  try{await api('POST','/v1/chat',{text,image:img});$('txt').value='';img=null;$('prev').style.display='none';await refresh();$('list').scrollTop=1e9}catch(x){alert(x.message)}};
if(token)start();
</script></body></html>
